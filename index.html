<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- NOTE: This CSP is permissive; tighten later once stable -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';"
    />

    <title>Chris Jeal | Ops Transformation</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- TEMP: Tailwind CDN (move to PostCSS for production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#06b6d4",
                hover: "#0891b2",
                glow: "rgba(6, 182, 212, 0.5)",
              },
              dark: {
                bg: "#020617",
                card: "rgba(255, 255, 255, 0.03)",
                border: "rgba(255, 255, 255, 0.08)",
              },
            },
            animation: {
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #020617;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- IMPORTANT: Vite entrypoint (this boots your React app) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
